<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- WhatsApp Vibrant 3D Circular Background -->
    <linearGradient id="wa-bg-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E71F2"/>
      <stop offset="50%" stop-color="#3B59D9"/>
      <stop offset="100%" stop-color="#283EAF"/>
    </linearGradient>

    <!-- Warm Indian Male Skin Tone Gradient with 3D Depth -->
    <linearGradient id="wa-skin-m" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="60%" stop-color="#F7CFA7"/>
      <stop offset="100%" stop-color="#E5B285"/>
    </linearGradient>
    <linearGradient id="wa-neck-m" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCA074"/>
      <stop offset="100%" stop-color="#C6895F"/>
    </linearGradient>

    <!-- Stylized Modern Dark Hair -->
    <linearGradient id="wa-hair-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1C13"/>
      <stop offset="50%" stop-color="#1B100B"/>
      <stop offset="100%" stop-color="#0E0805"/>
    </linearGradient>

    <!-- Medical Doctor Scrub -->
    <linearGradient id="wa-scrub-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <filter id="wa-shadow-soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0B132B" flood-opacity="0.25"/>
    </filter>
    <filter id="wa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- WhatsApp Avatar Disc Background -->
  <circle cx="100" cy="100" r="100" fill="url(#wa-bg-m)"/>
  <!-- Ambient highlight arc at top -->
  <path d="M25 50 A 90 90 0 0 1 175 50" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" stroke-linecap="round"/>

  <!-- Doctor Body / Lab Coat -->
  <g filter="url(#wa-shadow-soft)">
    <!-- White Doctor Coat with curved 3D WhatsApp avatar shoulders -->
    <path d="M32 200 C32 150 62 138 84 136 L116 136 C138 138 168 150 168 200 Z" fill="#FFFFFF"/>
    <path d="M32 200 C32 150 62 138 84 136 L100 172 L116 136 C138 138 168 150 168 200 Z" fill="#E2E8F0" opacity="0.65"/>

    <!-- Inner Doctor Scrub Top (WhatsApp styled V-neck) -->
    <path d="M84 136 L100 168 L116 136 L116 150 L100 174 L84 150 Z" fill="url(#wa-scrub-m)"/>

    <!-- Doctor Coat Lapels -->
    <path d="M72 138 L90 178 L78 186 L54 158 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M128 138 L110 178 L122 186 L146 158 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Stethoscope Around Neck (WhatsApp 3D style) -->
    <path d="M78 138 C75 164 82 195 95 195 C102 195 106 182 106 172" fill="none" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M122 138 C125 162 120 182 113 188" fill="none" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Chestpiece -->
    <circle cx="95" cy="195" r="7" fill="#64748B" stroke="#991B1B" stroke-width="2"/>
    <circle cx="95" cy="195" r="3" fill="#E2E8F0"/>
  </g>

  <!-- Neck -->
  <path d="M87 116 L87 142 C87 147 93 151 100 151 C107 151 113 147 113 142 L113 116 Z" fill="url(#wa-neck-m)"/>

  <!-- Ears (Chunky 3D rounded WhatsApp avatar style) -->
  <ellipse cx="61" cy="95" rx="8" ry="12" fill="url(#wa-skin-m)"/>
  <ellipse cx="139" cy="95" rx="8" ry="12" fill="url(#wa-skin-m)"/>
  <path d="M62 90 C60 94 60 98 63 100" fill="none" stroke="#DCA074" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M138 90 C140 94 140 98 137 100" fill="none" stroke="#DCA074" stroke-width="2.5" stroke-linecap="round"/>

  <!-- WhatsApp Avatar Head / Face Shape (3D Rounded jawline) -->
  <g filter="url(#wa-shadow-soft)">
    <path d="M65 80 C65 48 135 48 135 80 C135 114 122 130 100 130 C78 130 65 114 65 80 Z" fill="url(#wa-skin-m)"/>
  </g>

  <!-- WhatsApp 3D Hair (Voluminous, Textured Quiff/Fade) -->
  <path d="M61 78 C59 50 74 28 100 28 C126 28 141 50 139 78 C135 56 122 42 100 44 C82 46 72 58 61 78 Z" fill="url(#wa-hair-m)"/>
  <!-- Hair Pompadour Highlight / Tuft -->
  <path d="M82 32 C92 28 108 28 118 32 C124 35 120 40 110 40 C98 40 88 36 82 32 Z" fill="#3E271D"/>
  <path d="M61 78 C63 64 74 52 92 48 C80 52 70 65 68 80 Z" fill="#25160E"/>
  <path d="M139 78 C137 64 126 52 108 48 C120 52 130 65 132 80 Z" fill="#25160E"/>

  <!-- Eyebrows (Thick, confident, WhatsApp avatar curve) -->
  <path d="M72 75 Q83 70 93 74" fill="none" stroke="#180D06" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M107 74 Q117 70 128 75" fill="none" stroke="#180D06" stroke-width="4.2" stroke-linecap="round"/>

  <!-- WhatsApp Modern Black Acetate Spectacles -->
  <g filter="url(#wa-shadow-soft)">
    <rect x="68" y="78" width="26" height="20" rx="6" fill="rgba(255,255,255,0.18)" stroke="#111827" stroke-width="3"/>
    <rect x="106" y="78" width="26" height="20" rx="6" fill="rgba(255,255,255,0.18)" stroke="#111827" stroke-width="3"/>
    <!-- Glasses Bridge -->
    <path d="M94 85 L106 85" fill="none" stroke="#111827" stroke-width="3.2"/>
    <!-- Frame Temples -->
    <path d="M61 84 L68 84" fill="none" stroke="#111827" stroke-width="2.5"/>
    <path d="M132 84 L139 84" fill="none" stroke="#111827" stroke-width="2.5"/>
    <!-- Glass Reflection Highlights -->
    <path d="M72 82 L77 82 M72 86 L74 86" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M110 82 L115 82 M110 86 L112 86" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Eyes (Big, friendly, WhatsApp avatar style with gloss) -->
  <!-- Left Eye -->
  <ellipse cx="81" cy="88" rx="4.5" ry="5.2" fill="#1E293B"/>
  <circle cx="83" cy="86" r="1.8" fill="#FFFFFF"/>
  <circle cx="79.5" cy="89.5" r="0.9" fill="#FFFFFF"/>
  <!-- Right Eye -->
  <ellipse cx="119" cy="88" rx="4.5" ry="5.2" fill="#1E293B"/>
  <circle cx="121" cy="86" r="1.8" fill="#FFFFFF"/>
  <circle cx="117.5" cy="89.5" r="0.9" fill="#FFFFFF"/>

  <!-- WhatsApp Avatar Button/Shaded Nose -->
  <path d="M97 93 Q100 102 104 101 Q106 100 104 97" fill="none" stroke="#CF8F63" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Cheerful Doctor Broad Smile with Bright Teeth -->
  <g filter="url(#wa-shadow-soft)">
    <!-- Smile Mouth Opening -->
    <path d="M84 109 Q100 125 116 109 Z" fill="#991B1B"/>
    <!-- Top Teeth Arch -->
    <path d="M86 110 Q100 118 114 110 Q100 114 86 110 Z" fill="#FFFFFF"/>
    <!-- Lip Outline -->
    <path d="M82 108 Q100 127 118 108" fill="none" stroke="#1B100B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Friendly Rosy Cheeks -->
  <ellipse cx="73" cy="103" rx="7" ry="4" fill="#F43F5E" opacity="0.35"/>
  <ellipse cx="127" cy="103" rx="7" ry="4" fill="#F43F5E" opacity="0.35"/>

  <!-- WhatsApp Online / Certified Specialist Status Badge (Bottom Right) -->
  <g filter="url(#wa-shadow-soft)">
    <circle cx="162" cy="162" r="18" fill="#25D366" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Verified Dental Tooth Icon Inside WhatsApp Badge -->
    <path d="M157 159 C156 154 168 154 167 159 C166.5 162.5 165 165.5 162 168 C159 165.5 157.5 162.5 157 159 Z" fill="#FFFFFF"/>
  </g>
</svg>

