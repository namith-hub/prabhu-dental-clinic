<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" class="animated-doctor-icon dr-ramya-anim">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-f-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>

    <!-- Orthodontic Wire Glow Gradient -->
    <linearGradient id="ortho-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <filter id="glow-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseRingPink {
      0% { r: 52px; opacity: 0.8; stroke-width: 2px; }
      50% { r: 56px; opacity: 0.3; stroke-width: 3.5px; }
      100% { r: 52px; opacity: 0.8; stroke-width: 2px; }
    }
    @keyframes floatOrthoSmile {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3.5px) rotate(1.5deg); }
    }
    @keyframes pulseSparkleBadge {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
      42% { transform: scale(1.12); }
      70% { transform: scale(1); }
    }
    @keyframes twinkleOrthoStars {
      0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
    }
    @keyframes alignerSweep {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    .pulse-outer-ring-f {
      animation: pulseRingPink 3s ease-in-out infinite 0.5s;
      transform-origin: 60px 60px;
    }
    .floating-ortho-group {
      animation: floatOrthoSmile 3.5s ease-in-out infinite 0.4s;
      transform-origin: 60px 60px;
    }
    .pulse-star-badge {
      animation: pulseSparkleBadge 2.4s ease-in-out infinite 0.3s;
      transform-origin: 84px 36px;
    }
    .twinkle-star-f1 {
      animation: twinkleOrthoStars 2.4s ease-in-out infinite 0.2s;
      transform-origin: 30px 36px;
    }
    .twinkle-star-f2 {
      animation: twinkleOrthoStars 2.8s ease-in-out infinite 1.2s;
      transform-origin: 86px 82px;
    }
  </style>

  <!-- Animated Outer Pulsing Energy Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#FDA4AF" class="pulse-outer-ring-f"/>

  <!-- Base Circle Background -->
  <circle cx="60" cy="60" r="50" fill="url(#bg-f-anim)"/>

  <!-- Subtle Harmonic Geometry Radians Pattern -->
  <g opacity="0.15">
    <circle cx="60" cy="60" r="34" fill="none" stroke="#E11D48" stroke-width="1.2" stroke-dasharray="3 4"/>
    <ellipse cx="60" cy="60" rx="42" ry="24" fill="none" stroke="#E11D48" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <!-- Doctor Silhouette / Specialist Lab Coat Emblem (Orthodontics & Dentofacial Orthopaedics) -->
  <g class="floating-ortho-group">
    <!-- Doctor Coat Shoulders -->
    <path d="M34 94 C34 76 46 72 54 70 L66 70 C74 72 86 76 86 94 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M54 70 L60 84 L66 70 Z" fill="#0D9488"/> <!-- Elegant Teal Scrub Collar -->

    <!-- Stethoscope around neck -->
    <path d="M48 70 C46 80 50 90 56 90 C60 90 61 85 61 82" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M72 70 C74 78 72 85 68 88" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="56" cy="90" r="3" fill="#64748B"/>

    <!-- Central Aesthetic Orthodontic Smile Tooth Emblem with Brackets & Alignment Archwire -->
    <!-- Beautiful Symmetrical White Tooth -->
    <path d="M46 36 C44 26 76 26 74 36 C73 45 68 53 60 57 C52 53 47 45 46 36 Z" 
          fill="#FFFFFF" stroke="#E11D48" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Alignment Smile Archwire (Orthodontics Arc) -->
    <path d="M44 42 Q60 50 76 42" fill="none" stroke="#BE123C" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Precision Aesthetic Brackets on Teeth -->
    <rect x="49" y="39" width="4.5" height="4.5" rx="1.2" fill="#E11D48" stroke="#FFFFFF" stroke-width="0.8"/>
    <rect x="58" y="42" width="4.5" height="4.5" rx="1.2" fill="#E11D48" stroke="#FFFFFF" stroke-width="0.8"/>
    <rect x="67" y="39" width="4.5" height="4.5" rx="1.2" fill="#E11D48" stroke="#FFFFFF" stroke-width="0.8"/>

    <!-- Top Tooth Highlight Sparkle -->
    <path d="M51 32 C52 29 56 28 60 28" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Pulsing Orthodontic Star Badge (Top Right) -->
  <g class="pulse-star-badge">
    <circle cx="84" cy="36" r="12" fill="#E11D48" stroke="#FFFFFF" stroke-width="2" filter="url(#glow-f)"/>
    <!-- 4-Point Smile Alignment Star -->
    <path d="M84 30 L85.5 34.5 L90 36 L85.5 37.5 L84 42 L82.5 37.5 L78 36 L82.5 34.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- Animated Smile Twinkle Stars -->
  <g class="twinkle-star-f1">
    <path d="M30 32 L31.5 35.5 L35 37 L31.5 38.5 L30 42 L28.5 38.5 L25 37 L28.5 35.5 Z" fill="#E11D48"/>
  </g>
  <g class="twinkle-star-f2">
    <path d="M86 78 L87.5 81.5 L91 83 L87.5 84.5 L86 88 L84.5 84.5 L81 83 L84.5 81.5 Z" fill="#FDA4AF"/>
  </g>
</svg>
