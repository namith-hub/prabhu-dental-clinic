  <path d="M110 85 Q116 81 122 86" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M121 81 L124 83" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>

