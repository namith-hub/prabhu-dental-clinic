<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" class="animated-doctor-icon dr-mahesh-anim">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-m-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>

    <!-- Dental Implant Gradient -->
    <linearGradient id="implant-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="glow-m" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { r: 52px; opacity: 0.8; stroke-width: 2px; }
      50% { r: 56px; opacity: 0.3; stroke-width: 3.5px; }
      100% { r: 52px; opacity: 0.8; stroke-width: 2px; }
    }
    @keyframes floatImplant {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3.5px); }
    }
    @keyframes pulseHeartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
      42% { transform: scale(1.12); }
      70% { transform: scale(1); }
    }
    @keyframes rotateDentalCross {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sparkleTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
    }

    .pulse-outer-ring {
      animation: pulseRing 3s ease-in-out infinite;
      transform-origin: 60px 60px;
    }
    .floating-implant-group {
      animation: floatImplant 3.5s ease-in-out infinite;
      transform-origin: 60px 60px;
    }
    .pulse-heart-badge {
      animation: pulseHeartbeat 2.4s ease-in-out infinite;
      transform-origin: 84px 36px;
    }
    .twinkle-star-1 {
      animation: sparkleTwinkle 2.2s ease-in-out infinite;
      transform-origin: 32px 34px;
    }
    .twinkle-star-2 {
      animation: sparkleTwinkle 2.6s ease-in-out infinite 1.1s;
      transform-origin: 88px 84px;
    }
  </style>

  <!-- Animated Outer Pulsing Energy Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#38BDF8" class="pulse-outer-ring"/>

  <!-- Base Circle Background -->
  <circle cx="60" cy="60" r="50" fill="url(#bg-m-anim)"/>

  <!-- Subtle Medical Cross Background Grid Pattern -->
  <g opacity="0.15">
    <line x1="60" y1="20" x2="60" y2="100" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="20" y1="60" x2="100" y2="60" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="60" cy="60" r="32" fill="none" stroke="#0284C7" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <!-- Doctor Silhouette / Specialist Lab Coat Emblem (Periodontics & Implantology) -->
  <g class="floating-implant-group">
    <!-- Doctor Shoulders/Coat -->
    <path d="M34 94 C34 76 46 72 54 70 L66 70 C74 72 86 76 86 94 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M54 70 L60 84 L66 70 Z" fill="#0284C7"/> <!-- Blue Scrub V-Neck -->

    <!-- Doctor Stethoscope around neck -->
    <path d="M48 70 C46 80 50 90 56 90 C60 90 61 85 61 82" fill="none" stroke="#C82333" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M72 70 C74 78 72 85 68 88" fill="none" stroke="#C82333" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="56" cy="90" r="3" fill="#64748B"/>

    <!-- Central Dental Tooth & Titanium Implant Crown (Signature Specialty) -->
    <!-- Natural Tooth Crown -->
    <path d="M48 40 C46 28 74 28 72 40 C71 47 68 53 60 57 C52 53 49 47 48 40 Z" 
          fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Tooth Shine Highlight -->
    <path d="M52 35 C53 32 58 31 62 31" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

    <!-- Implant Screw Thread Base (Implantology) -->
    <line x1="55" y1="57" x2="65" y2="57" stroke="#0369A1" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="56" y1="61" x2="64" y2="61" stroke="#0369A1" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="57" y1="65" x2="63" y2="65" stroke="#0369A1" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="60" cy="69" r="1.5" fill="#0369A1"/>
  </g>

  <!-- Pulsing Specialist Badge (Top Right) -->
  <g class="pulse-heart-badge">
    <circle cx="84" cy="36" r="12" fill="#C82333" stroke="#FFFFFF" stroke-width="2" filter="url(#glow-m)"/>
    <!-- Medical Dental Cross -->
    <path d="M81 36 L87 36 M84 33 L84 39" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Animated Twinkle Sparkles -->
  <g class="twinkle-star-1">
    <path d="M32 30 L33.5 33.5 L37 35 L33.5 36.5 L32 40 L30.5 36.5 L27 35 L30.5 33.5 Z" fill="#0284C7"/>
  </g>
  <g class="twinkle-star-2">
    <path d="M88 80 L89 83 L92 84 L89 85 L88 88 L87 85 L84 84 L87 83 Z" fill="#38BDF8"/>
  </g>
</svg>
